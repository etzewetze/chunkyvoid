name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 1.19-R0.1-SNAPSHOT
            java: '17'
          - api: 26.3-R0.1-SNAPSHOT
            java: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Compile and test against Spigot API
        run: mvn -B verify -Dspigot.version=${{ matrix.api }}
      - name: Publish baseline jar as workflow artifact
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: ChunkyVoid-${{ github.sha }}
          path: target/chunkyvoid-*.jar
          if-no-files-found: error
