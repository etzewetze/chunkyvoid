name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test release jar
        run: mvn -B verify
      - name: Publish versioned GitHub release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          if ! gh release view "v$version" >/dev/null 2>&1; then
            gh release create "v$version" "target/chunkyvoid-$version.jar" \
              --title "ChunkyVoid v$version" \
              --notes "Void-Generator, pausierbare Vorabgenerierung und unsichtbare sichere Border. Mitentwicklung: OpenAI Codex (KI-Assistenz). Installation und Einschränkungen: README."
          fi
